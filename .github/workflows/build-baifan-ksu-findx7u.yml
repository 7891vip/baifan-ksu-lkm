name: Build Baifan KSU LKM findx7u android14-11-o

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git build-essential bc flex bison libssl-dev libelf-dev \
            python3 ccache zstd curl unzip

      - name: Clone OPLUS SM8650 6.1.118 kernel source
        run: |
          git clone --depth=1 \
            -b oneplus/sm8650_b_16.0.0_oneplus12 \
            https://github.com/cctv18/android_kernel_common_oneplus_sm8650 \
            kernel_src

      - name: Download Clang toolchain
        run: |
          mkdir -p toolchain/clang20 toolchain/build-tools
          curl -L -o clang.zip \
            https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang20-r547379/clang-r547379.zip
          unzip -q clang.zip -d toolchain/clang20
          curl -L -o bt.zip \
            https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang20-r547379/build-tools.zip
          unzip -q bt.zip -d toolchain/build-tools
          if [ -d toolchain/clang20/bin ]; then
            echo "CLANG_BIN=$GITHUB_WORKSPACE/toolchain/clang20/bin" >> "$GITHUB_ENV"
          else
            echo "CLANG_BIN=$(dirname "$(find toolchain/clang20 -name clang -type f | head -n1)")" >> "$GITHUB_ENV"
          fi
          if [ -d toolchain/build-tools/bin ]; then
            echo "BT_BIN=$GITHUB_WORKSPACE/toolchain/build-tools/bin" >> "$GITHUB_ENV"
          else
            echo "BT_BIN=$(dirname "$(find toolchain/build-tools -name ld.lld -type f | head -n1)")" >> "$GITHUB_ENV"
          fi

      - name: Configure kernel (integrate KernelSU as module)
        run: |
          cd kernel_src
          # 去除 GKI ABI 保护，使 KernelSU 需要的符号（path_umount/init_mm 等）对模块可见
          rm -f android/abi_gki_protected_exports_* || true
          # 集成大肥鱼KSU的 kernel/ 源码为内核树内的模块
          ln -sf "$(realpath --relative-to=drivers "$GITHUB_WORKSPACE/kernel")" drivers/kernelsu
          grep -q "kernelsu" drivers/Makefile || printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig || sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          # defconfig 定制：KSU 模块 + OPPO KMI + 关闭无用的 BTF
          printf '\nCONFIG_KSU=m\n' >> arch/arm64/configs/gki_defconfig
          printf 'CONFIG_LOCALVERSION="-android14-11-o"\n' >> arch/arm64/configs/gki_defconfig
          printf 'CONFIG_DEBUG_INFO_BTF=n\n' >> arch/arm64/configs/gki_defconfig
          sed -i 's/check_defconfig//' build.config.gki
          # 修复 clang20 对 6.1 内核 vendored libbpf 的 -Werror 兼容性
          find tools -type f -name 'Makefile*' -exec sed -i 's/-Werror//g' {} + 2>/dev/null || true
          # DDK 同款：禁用 modpost 的 check_exports，允许 KernelSU 引用 GKI 保留符号
          MODPOST=scripts/mod/modpost.c
          sed -i -E 's/^([[:space:]]*)check_exports\(mod\);/\1\/\/ check_exports(mod);/' "$MODPOST"
          sed -i -E 's/^([[:space:]]*)s->module = exp->module;/\1\/\/ s->module = exp->module;/' "$MODPOST"
          sed -i 's/^static void check_exports(/static void __attribute__((unused)) check_exports(/' "$MODPOST"

      - name: Build kernelsu.ko
        run: |
          export PATH="$CLANG_BIN:$BT_BIN:$PATH"
          cd kernel_src
          make LLVM=1 ARCH=arm64 O=out KCFLAGS=-Wno-error gki_defconfig
          make LLVM=1 ARCH=arm64 O=out KCFLAGS=-Wno-error \
            KSU_GIT_VERSION=2680 \
            KSU_VERSION=32680 \
            KSU_EXPECTED_SIZE=0x0339 \
            KSU_EXPECTED_HASH=bad08be1f8e813067892adca0e70452cd645ba31e5ed15bec35e60fa430f2f48 \
            KSU_MANAGER_PACKAGE=me.weishu.kernelsu \
            modules -j"$(nproc)"
          KO=$(find out -name kernelsu.ko | head -n1)
          echo "KO=$KO"
          cp "$KO" kernelsu-android14-11-o-baifan.ko
          "$CLANG_BIN/llvm-strip" -d kernelsu-android14-11-o-baifan.ko || true
          echo "--- artifact ---"
          ls -lh kernelsu-android14-11-o-baifan.ko
          strings kernelsu-android14-11-o-baifan.ko | grep -E 'vermagic=|android14' | head

      - name: Upload kernelsu.ko
        uses: actions/upload-artifact@v4
        with:
          name: kernelsu-android14-11-o-baifan
          path: kernel_src/kernelsu-android14-11-o-baifan.ko
